name: Pinsta
options:
  bundleIdPrefix: se.sarper
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Bump CURRENT_PROJECT_VERSION for every TestFlight upload; app and extension must match.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    # Paid developer team (2026-10-01). Automatic signing: Xcode registers the
    # bundle IDs + App Group and makes the profiles (archive with -allowProvisioningUpdates).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8D6ML34D52
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pinsta:
    type: application
    platform: iOS
    sources:
      - path: Pinsta
        excludes: ["*.entitlements"]
    dependencies:
      - target: PinstaShare
        embed: true
    entitlements:
      path: Pinsta/Pinsta.entitlements
      properties:
        com.apple.security.application-groups: [group.se.sarper.vicolo]
    info:
      path: Pinsta/Info.plist
      properties:
        CFBundleDisplayName: Vicolo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, no custom crypto: exempt, so TestFlight skips the compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Vicolo opens on the places you saved within 50 km of you, and uses your location for Near me. It is never stored or sent anywhere.
        # Splash (2026-10-02): light and dark art in Assets, 1320pt-wide @3x so it
        # covers the largest iPhone; smaller ones crop the edges. Follows the
        # system appearance, not the in-app one (iOS decides before the app runs).
        UILaunchScreen:
          UIImageName: Splash
          UIColorName: SplashBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only passes App Store validation only when iPad multitasking is opted out.
        UIRequiresFullScreen: true
        LSApplicationQueriesSchemes: [comgooglemaps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sarper.vicolo
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PinstaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PinstaShare
        excludes: ["*.entitlements"]
      # Shared with the app: model, services, and the save flow itself.
      - path: Pinsta/Models
      - path: Pinsta/Services
      - path: Pinsta/Views/AddPlaceView.swift
    entitlements:
      path: PinstaShare/PinstaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.se.sarper.vicolo]
    info:
      path: PinstaShare/Info.plist
      properties:
        CFBundleDisplayName: Vicolo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sarper.vicolo.share
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
