name: Pinsta
options:
  bundleIdPrefix: se.sarper
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Bump CURRENT_PROJECT_VERSION for every TestFlight upload; app and extension must match.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: enough for the Simulator and embeds the entitlements
    # (App Group). Swap for a real team when the developer account exists.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pinsta:
    type: application
    platform: iOS
    sources:
      - path: Pinsta
        excludes: ["*.entitlements"]
    dependencies:
      - target: PinstaShare
        embed: true
    entitlements:
      path: Pinsta/Pinsta.entitlements
      properties:
        com.apple.security.application-groups: [group.se.sarper.pinsta]
    info:
      path: Pinsta/Info.plist
      properties:
        CFBundleDisplayName: Pinsta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, no custom crypto: exempt, so TestFlight skips the compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [comgooglemaps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sarper.pinsta
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PinstaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PinstaShare
        excludes: ["*.entitlements"]
      # Shared with the app: model, services, and the save flow itself.
      - path: Pinsta/Models
      - path: Pinsta/Services
      - path: Pinsta/Views/AddPlaceView.swift
    entitlements:
      path: PinstaShare/PinstaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.se.sarper.pinsta]
    info:
      path: PinstaShare/Info.plist
      properties:
        CFBundleDisplayName: Pinsta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sarper.pinsta.share
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
